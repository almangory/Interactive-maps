<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#092532" />
      <stop offset="50%" stop-color="#0e4b61" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="102" fill="none" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.3" />

  <!-- GIS Network Lines Background -->
  <g stroke="#38bdf8" stroke-opacity="0.25" stroke-width="8" stroke-dasharray="16 12">
    <path d="M 60 160 L 190 160 L 190 280 L 320 280" />
    <path d="M 450 360 L 320 360 L 320 220 L 210 220" />
  </g>
  <circle cx="60" cy="160" r="14" fill="#38bdf8" fill-opacity="0.6" />
  <circle cx="450" cy="360" r="14" fill="#10b981" fill-opacity="0.6" />

  <!-- Outer Map Pin Shadow & Glow -->
  <path d="M 256 70 C 160 70 82 148 82 244 C 82 360 256 460 256 460 C 256 460 430 360 430 244 C 430 148 352 70 256 70 Z" 
        fill="#031d28" opacity="0.4" transform="translate(0, 10)" />

  <!-- Main Map Pin -->
  <path d="M 256 70 C 160 70 82 148 82 244 C 82 360 256 460 256 460 C 256 460 430 360 430 244 C 430 148 352 70 256 70 Z" 
        fill="url(#pinGrad)" />

  <!-- Inner Pin Contour -->
  <path d="M 256 94 C 173 94 106 161 106 244 C 106 338 256 426 256 426 C 256 426 406 338 406 244 C 406 161 339 94 256 94 Z" 
        fill="#0b2d3d" />

  <!-- Water Drop Inside Pin -->
  <path d="M 256 135 C 256 135 170 235 170 280 C 170 327 208 365 256 365 C 304 365 342 327 342 280 C 342 235 256 135 256 135 Z" 
        fill="url(#dropGrad)" />

  <!-- Water Drop Highlight/Reflection -->
  <path d="M 230 220 C 210 250 205 275 210 295 C 200 285 198 265 212 240 C 220 225 230 220 230 220 Z" 
        fill="#ffffff" opacity="0.65" />

  <!-- GIS Node Points -->
  <circle cx="256" cy="365" r="16" fill="#38bdf8" />
  <circle cx="256" cy="365" r="8" fill="#ffffff" />
</svg>